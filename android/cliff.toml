# git-cliff: release.sh takes the next version from the Conventional
# Commits since the last tag (`git cliff --bumped-version`).
[git]
conventional_commits = true
filter_unconventional = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"

[bump]
# Before 1.0, a feat or a breaking change bumps the minor.
features_always_bump_minor = true
breaking_always_bump_major = false
