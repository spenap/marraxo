# Builds the APK and runs the unit tests (roadmap Track T, T1–T2) on every
# push. Device-only checks (UI tests, the scroll benchmark, the real
# speakers and TV) are not here; they run by hand.
name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count, versionName comes from git describe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM, Robolectric, fake renderer)
        run: ./gradlew testDebugUnitTest
      - name: Release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
