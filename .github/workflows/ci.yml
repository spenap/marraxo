# Builds the APK and runs the unit tests (roadmap Track T, T1–T2) on every
# push. Device-only checks (UI tests, the scroll benchmark, the real
# speakers and TV) are not here; they run by hand.
name: CI

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is the commit count, versionName comes from git describe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM, Robolectric, fake renderer)
        run: ./gradlew testDebugUnitTest
      - name: Release APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # The UI tests on an Android 8.1 emulator (the Nexus 4's version), using
  # the runners' KVM acceleration. Timing is meaningless here; the scroll
  # benchmark stays on the real phone.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86
          target: default
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-reports
          path: android/app/build/reports/androidTests/
