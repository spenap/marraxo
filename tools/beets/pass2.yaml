# Second automatic pass, over the albums the first pass skipped only.
# Layered on top of config.yaml:  BEETS_OVERLAY=pass2.yaml ./beet import ...
import:
  log: tools/beets/out/import-pass2.log

match:
  # Accept from ~88% similarity (pass 1: 92%).
  strong_rec_thresh: 0.12
  # A rip missing a track or two can still be the right release; the
  # missing tracks still count against the similarity above.
  max_rec:
    missing_tracks: strong
